[project]
name = "gsc-cli"
version = "0.2.0"
description = "Google Search Console CLI and backend for Claude Code SEO-analysis skills."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SEO Consult", email = "margpeeva@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "google-search-console",
    "gsc",
    "seo",
    "search-analytics",
    "search-console-api",
    "cli",
    "webmaster-tools",
    "url-inspection",
    "sitemaps",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.1",
    "google-api-python-client>=2.0",
    "tabulate>=0.9",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://seoconsult.bg"
Documentation = "https://github.com/stenliseo/gsc-cli#readme"
Repository = "https://github.com/stenliseo/gsc-cli"
Issues = "https://github.com/stenliseo/gsc-cli/issues"

[project.scripts]
gsc = "gsc.cli.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsc"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned to the classic defaults so newer ruff releases do not change the rule set.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
